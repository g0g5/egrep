[project]
name = "egrep"
version = "0.1.0"
description = "Hybrid workspace search CLI for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "llama-index",
    "llama-index-vector-stores-chroma",
    "llama-index-retrievers-bm25",
    "PyStemmer",
    "requests",
    "pathspec",
    "questionary",
    "tree-sitter-language-pack>=1.8.0",
]

[project.scripts]
egrep = "egrep.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "responses",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
